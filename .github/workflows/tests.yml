name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: python -m pip install pytest pytest-asyncio ruff
      - run: ruff check .
      - run: python -m pytest tests/ -q
      - run: node --test scripts/fetch_tweets.test.cjs
